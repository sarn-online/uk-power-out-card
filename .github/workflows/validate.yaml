name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run build
      - run: npm run check
      - run: npm test
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          comment: false
